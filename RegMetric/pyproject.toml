[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regmetric"
version = "0.1.0"
description = "Perceptual metrics and uncertainty-aware models for medical image registration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ml-collections==1.1.0",
    "nibabel==5.3.3",
    "nnInteractive==1.1.3",
    "numpy==2.2.6",
    "SimpleITK==2.5.3",
    "timm==1.0.22",
    "torch==2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
